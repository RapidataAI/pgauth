listen: ":5432"
health: ":8080"
http:
  listen: ":8443"          # HTTPS with the tls certificate: GET /.well-known/pgauth, GET /v1/access
accessHelp: "Ask for access in #data-access."   # appended to every no-binding denial; shown by `pgauth ls` when nothing is reachable
discovery:
  cliClientId: pgauth-cli  # public OIDC client connectors log in with
  # postgres: pgauth.example.com:5432   # default: the request's host and the listen port            # GET /healthz (live), /readyz (keys loaded, every instance reachable as the issuer)

tls:
  certFile: /etc/pgauth/tls/tls.crt   # reread when the file changes
  keyFile: /etc/pgauth/tls/tls.key

oidc:
  issuer: https://auth.example.com
  audience: https://postgres.example.com
  usernameClaim: email               # default; matched by `kind: User` subjects
  usernameCaseInsensitive: true      # default; User subjects match the username ignoring case
  groupsClaim: groups                # default; matched by `kind: Group` subjects; array, or a string for one group
  groupsPrefix: ""                   # default; prepended to every group from the token
  scopes:                            # defaults; a token with neither scope is refused
    read: postgres:read              #   caps access at read
    write: postgres:write            #   allows write where a binding grants it
  clientIdClaim: client_id           # default; falls back to azp
  allowedClients: []                 # empty allows any client

rbac:
  dir: /etc/pgauth/rbac              # PgRole / PgRoleBinding YAML, reread on change
  reloadInterval: 10s                # default

# Postgres group role per access level; {db} is the database name. These are the defaults.
groupRoles:
  read: "{db}_read"
  write: "{db}_write"

tempGroup: pgauth_temp     # default
rolePrefix: pgauth_        # default
maxConnectionAge: 12h      # default
sweepMinAge: 5m            # default; the startup sweep spares younger roles

instances:
  - name: main
    host: 10.0.0.3
    port: 5432
    sslmode: verify-ca     # default verify-full
    sslrootcert: /etc/pgauth/upstream-ca.pem
    adminDatabase: postgres
    databases: [orders, billing]
    credentialsFile: /etc/pgauth/credentials/main.json
    # statsRole: pgauth_stats   # optional: every temporary role also joins it (e.g. for pg_stat_statements); the issuer needs ADMIN on it   # {"username": "pgauth", "password": "..."}
