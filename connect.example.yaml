# Defaults for `pgauth connect`; put this in <user config dir>/pgauth/connect.yaml. Flags override it.
issuer: https://auth.example.com/
clientId: pgauth-cli
resource: https://postgres.example.com
scope: openid offline_access postgres:read
server: pgauth.example.com:5432
# serverCA: /path/to/internal-ca.pem   # only when pgauth's certificate is not signed by a public CA
listeners:             # one local port per instance; bare database names get "<instance>/"
  - {listen: 127.0.0.1:15432, instance: main}
  - {listen: 127.0.0.1:15433, instance: bidder}
# listen: 127.0.0.1:5432  # a listener without instance: clients send "<instance>/<db>" themselves
callbackPort: 8250     # login redirect http://127.0.0.1:8250/callback; 0 = any free port
