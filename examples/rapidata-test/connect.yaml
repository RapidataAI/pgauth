# Rapidata test (VPN). Easiest: `pgauth env add test pgauth.rabbitdata.internal`, which writes this.
# Then `pgauth connect` (or `pgauth service install`) and `psql "host=127.0.0.1 dbname=test/order"`.
listen: 127.0.0.1:5432
callbackPort: 8250
environments:
  test:
    server: pgauth.rabbitdata.internal:5432
    api: https://pgauth.rabbitdata.internal:8443
    # serverCA: /path/to/rapidata-internal-ca.pem   # if the internal CA is not in your system trust store
    token:
      login: browser
      issuer: https://auth.rabbitdata.ch/
      clientId: pgauth-cli
      resource: https://postgres.rabbitdata.ch
      scope: openid offline_access postgres:read   # postgres:write (env add --write) if you hold a write grant
